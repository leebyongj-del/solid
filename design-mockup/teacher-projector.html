<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전자칠판 투사 모드 목업 · 입체 탐험대</title>
<link rel="stylesheet" href="assets/tokens.css">
<style>
  /* 1920×1080 기준. 1rem = 화면 폭의 1/96이라 어떤 16:9 칠판에서도 같은 비율로 보인다. */
  html { font-size: calc(100vw / 96); }
  body.board { height: 100vh; overflow: hidden; display: grid; grid-template-rows: 6.4rem 1fr 7.2rem; font-size: 1rem; background: var(--cream); }

  /* ── 상단: 코드 · 지금 단계 · 타이머 ───────────── */
  .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 2rem; padding: 0 1.6rem; border-bottom: 1px solid var(--line); background: var(--paper); }
  .room small { display: block; font-size: .85rem; color: var(--muted); font-weight: 700; }
  .room .code { display: flex; align-items: baseline; gap: .8rem; }
  .room .code b { font-size: 2.5rem; font-weight: 800; letter-spacing: .14em; color: var(--ink); line-height: 1.1; }
  .room .code span { font-size: .95rem; color: var(--text); }
  .now { text-align: center; }
  .now p { font-size: 1rem; color: var(--muted); font-weight: 700; }
  .now h1 { font-size: 2.3rem; font-weight: 800; line-height: 1.15; }
  .phases { display: flex; justify-content: center; gap: .3rem; margin-top: .35rem; }
  .phases li { list-style: none; display: flex; align-items: center; gap: .35rem; font-size: .8rem; font-weight: 700; color: var(--muted); padding: .15rem .6rem; border-radius: 999px; }
  .phases li::before { content: ''; width: .5rem; height: .5rem; border-radius: 50%; border: 2px solid var(--line-strong); }
  .phases li.done::before { background: var(--plum-mark); border-color: var(--plum-mark); }
  .phases li.now { background: var(--plum-soft); color: var(--plum); }
  .phases li.now::before { background: var(--plum); border-color: var(--plum); }
  .phases { padding: 0; margin-bottom: 0; }
  .timer { justify-self: end; text-align: right; }
  .timer small { display: block; font-size: .85rem; color: var(--muted); font-weight: 700; }
  .timer b { font-size: 3.6rem; font-weight: 800; color: var(--ink); line-height: 1; letter-spacing: -.02em; }
  .timer.soon b { color: var(--wait-ink); }

  /* ── 분류 벽 ──────────────────────────────────── */
  .wall { min-height: 0; display: grid; grid-template-columns: 1.35fr 1.6fr 1fr .9fr 1fr; gap: .8rem; padding: .8rem 1.6rem; }
  .lane { min-height: 0; display: grid; grid-template-rows: auto 1fr; border-radius: 1rem; background: var(--paper); box-shadow: var(--shadow-card); overflow: hidden; }
  .lane > header { display: flex; align-items: center; gap: .5rem; padding: .6rem .8rem; font-size: 1.2rem; font-weight: 800; white-space: nowrap; }
  .lane > header svg { width: 1.6rem; height: 1.6rem; }
  .lane > header b { margin-left: auto; min-width: 2.2rem; text-align: center; padding: .05rem .5rem; border-radius: 999px; background: rgba(255, 255, 255, .8); font-size: 1.15rem; }
  .k-poly > header { background: var(--poly-bg); color: var(--poly-ink); }
  .k-rev > header { background: var(--rev-bg); color: var(--rev-ink); }
  .k-mix > header { background: var(--mix-bg); color: var(--mix-ink); }
  .k-hold > header { background: var(--hold-bg); color: var(--hold-ink); }
  .k-none > header { background: var(--none-bg); color: var(--none-ink); }
  .cards { min-height: 0; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr); grid-auto-rows: max-content; align-content: start; gap: .6rem; padding: .6rem; }
  .k-poly .cards, .k-rev .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  .card { position: relative; display: flex; flex-direction: column; text-align: left; border-radius: .7rem; overflow: hidden; background: #fff; border: 1px solid var(--line); padding: 0; transition: transform .2s var(--ease-out), box-shadow .2s var(--ease-out); }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-float); }
  .card img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; }
  .card .grp { position: absolute; left: .4rem; top: .4rem; padding: .1rem .5rem; border-radius: .45rem; background: rgba(255, 255, 255, .95); color: var(--ink); font-size: .95rem; font-weight: 800; }
  .card .new { position: absolute; right: .4rem; top: .4rem; padding: .1rem .5rem; border-radius: .45rem; background: var(--plum); color: #fff; font-size: .75rem; font-weight: 800; }
  .card .meta { padding: .45rem .6rem .55rem; display: flex; flex-direction: column; gap: .15rem; }
  .card strong { font-size: 1.1rem; color: var(--ink); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .row { display: flex; align-items: center; gap: .4rem; font-size: .85rem; color: var(--text); white-space: nowrap; }
  .card .row .model { font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
  .steps { margin-left: auto; display: flex; gap: .15rem; flex: none; }
  .steps i { width: .5rem; height: .5rem; border-radius: 50%; border: 2px solid var(--line-strong); }
  .steps i.on { background: var(--plum); border-color: var(--plum); }
  .steps.all i { background: var(--ok-dot); border-color: var(--ok-dot); }
  .card .why { font-size: .85rem; color: var(--text); line-height: 1.45; }
  .more { grid-column: 1 / -1; display: grid; place-items: center; min-height: 2.6rem; border-radius: .7rem; border: 1.5px dashed var(--line-strong); color: var(--ink); font-size: .9rem; font-weight: 700; }

  .k-none .card { flex-direction: row; align-items: stretch; background: var(--none-bg); border-style: dashed; border-color: var(--none-mark); }
  .k-none .card img { width: 5.2rem; aspect-ratio: auto; height: auto; object-fit: cover; filter: saturate(.75); }
  .k-none .card .grp { position: static; background: none; padding: 0; font-size: 1rem; }
  .k-none .card .meta { padding: .5rem .7rem; }
  .k-none .card .row { color: var(--none-ink); white-space: normal; }

  /* ── 하단: 모둠별 진행 ──────────────────────────── */
  .groups { display: grid; grid-template-columns: auto repeat(8, 1fr); gap: .6rem; align-items: center; padding: .6rem 1.6rem .9rem; }
  .groups h2 { font-size: 1.05rem; color: var(--muted); writing-mode: horizontal-tb; width: 4.4rem; line-height: 1.3; }
  .g { display: grid; gap: .3rem; padding: .55rem .7rem; border-radius: .8rem; background: var(--paper); border: 1px solid var(--line); }
  .g header { display: flex; align-items: baseline; justify-content: space-between; }
  .g header b { font-size: 1.1rem; color: var(--ink); }
  .g header span { font-size: .8rem; color: var(--muted); font-weight: 700; }
  .g .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: .25rem; }
  .g .slots i { height: .8rem; border-radius: .25rem; background: var(--sunk); border: 1px dashed var(--line-strong); overflow: hidden; position: relative; }
  .g .slots i::after { content: ''; position: absolute; inset: 0; width: var(--p, 0%); background: var(--plum-mark); }
  .g .slots i.has { border-style: solid; border-color: var(--line); background: var(--plum-soft); }
  .g .slots i.full::after { background: var(--ok-dot); }
  .g.stuck { background: var(--wait-bg); border-color: #f0d49c; }
  .g.stuck header span { color: var(--wait-ink); }

  /* ── 교사만 쓰는 조작 ───────────────────────────── */
  /* 칠판에는 안 보이고, 마우스를 움직이거나 키보드로 들어오면 나타난다 */
  .dock { position: fixed; left: 50%; bottom: 8rem; display: flex; gap: .4rem; padding: .3rem; border-radius: 1rem; background: rgba(62, 49, 56, .94); box-shadow: var(--shadow-float); opacity: 0; transform: translate(-50%, .6rem); transition: opacity .25s, transform .25s var(--ease-out); z-index: 20; }
  .dock.awake, .dock:hover, .dock:focus-within { opacity: 1; transform: translate(-50%, 0); }
  .confirm { display: none; align-items: center; gap: .5rem; padding: 0 .4rem 0 .8rem; color: #fff; font-size: .8rem; font-weight: 700; white-space: nowrap; border-left: 1px solid rgba(255, 255, 255, .2); }
  .confirm.show { display: flex; }
  .confirm .yes { background: #ffd2c4; color: #6b2a17; }
  .dock button { min-height: 2.4rem; min-width: 2.4rem; padding: 0 .8rem; border-radius: .7rem; color: #fff; font-size: .8rem; font-weight: 700; display: flex; align-items: center; gap: .3rem; white-space: nowrap; }
  .dock button:hover { background: rgba(255, 255, 255, .14); }
  .dock .end { color: #ffd2c4; }
  .dock svg { width: 1.1rem; height: 1.1rem; }

  /* ── 스포트라이트: 공유하기 장면 ─────────────────── */
  .spot { position: fixed; inset: 0; z-index: 40; display: none; place-items: center; background: rgba(46, 36, 42, .72); }
  .spot.show { display: grid; animation: fade .35s var(--ease-out); }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .spot article { width: 86vw; height: 78vh; display: grid; grid-template-columns: 1.15fr .8fr 1fr; gap: 1rem; padding: 1.2rem; border-radius: 1.4rem; background: var(--cream); box-shadow: var(--shadow-float); animation: rise .45s var(--ease-out); }
  @keyframes rise { from { transform: translateY(1.2rem) scale(.98); } to { transform: none; } }
  .spot figure { margin: 0; position: relative; border-radius: 1rem; overflow: hidden; background: var(--sunk); }
  .spot figure img { width: 100%; height: 100%; object-fit: cover; }
  .spot figure .m { width: 100%; height: 100%; display: grid; place-items: center; background: #fdf8f4 radial-gradient(circle, rgba(90, 68, 80, .13) 1px, transparent 1.4px) 0 0 / 1rem 1rem; }
  .spot figure .m svg { width: 80%; height: 70%; }
  .spot figcaption { position: absolute; left: .7rem; bottom: .7rem; padding: .2rem .7rem; border-radius: .6rem; background: rgba(255, 255, 255, .95); font-size: 1.1rem; font-weight: 800; color: var(--ink); }
  .spot .text { display: flex; flex-direction: column; gap: .9rem; padding: .4rem .4rem 0; overflow: hidden; }
  .spot .text .who { font-size: 1.1rem; font-weight: 800; color: var(--plum); }
  .spot .text h2 { font-size: 2.2rem; font-weight: 800; }
  .spot .text h3 { font-size: .95rem; color: var(--muted); margin-bottom: .3rem; }
  .spot .text p { font-size: 1.25rem; line-height: 1.55; color: var(--ink); }
  .spot .text .then p { color: var(--text); font-size: 1.1rem; }
  .spot .tag { display: inline-flex; align-items: center; gap: .3rem; padding: .1rem .6rem; border-radius: 999px; font-size: .95rem; font-weight: 800; background: var(--rev-bg); color: var(--rev-ink); margin-bottom: .4rem; }
  .spot .tag svg { width: 1.2rem; height: 1.2rem; }
  .spot .close { position: absolute; top: 1.4rem; right: 1.6rem; min-height: 2.8rem; padding: 0 1.1rem; border-radius: .8rem; background: #fff; color: var(--ink); font-size: 1rem; font-weight: 800; }

  .mock-badge { font-size: .65rem; }
</style>
</head>
<body class="board">
<header class="top">
  <div class="room"><small>우리 학교 입체 탐험 · 1학년 3반</small>
    <div class="code"><b>YVQHLJ</b><span>수업 코드 · 모둠 이름으로 참여</span></div></div>
  <div class="now"><p>지금은</p><h1 id="phase-h">하나씩 탐구 시간</h1>
    <ol class="phases" id="phases"></ol></div>
  <div class="timer" id="timer"><small>이 활동 남은 시간</small><b id="clock">12:40</b></div>
</header>

<main class="wall" id="wall"></main>

<footer class="groups"><h2>모둠 진행</h2><div style="display:contents" id="groups"></div></footer>

<nav class="dock" aria-label="교사 조작">
  <button type="button" data-act="prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>이전 단계</button>
  <button type="button" data-act="next">다음 단계<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
  <button type="button" data-act="timer"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>타이머</button>
  <button type="button" data-act="manage">관리 화면</button>
  <button type="button" class="end" data-act="end" aria-expanded="false">수업 마감…</button>
  <div class="confirm" id="confirm" role="alertdialog" aria-label="수업 마감 확인"><span>마감하면 학생 제출이 멈춰요.</span><button type="button" class="yes" data-act="end-yes">마감하기</button><button type="button" data-act="end-no">취소</button></div>
</nav>

<div class="spot" id="spot" role="dialog" aria-modal="true" aria-label="모둠 발견 크게 보기"></div>
<p class="mock-badge">목업 · 예시 데이터</p>

<script src="assets/shapes.js"></script>
<script>
const { SOLIDS, NAMES, ICONS } = window.Shapes;
const PHASES = ['사진 모으기', '하나씩 탐구', '발견 모아보기', 'AI 오류 탐정'];
const LANES = [
  { id: 'poly', name: '다면체' }, { id: 'rev', name: '회전체' }, { id: 'mix', name: '여러 도형의 결합' },
  { id: 'hold', name: '판단 보류' }, { id: 'none', name: '아직 생각 전' },
];
// 예시 데이터 — 실제 학생 기록이 아님
const CARDS = [
  { k: 'rev', img: 'bin', t: '복도 쓰레기통', g: '3모둠', m: 'cylinder', s: 4, isNew: true,
    first: '위아래가 똑같은 원 모양이고 옆면이 둥글게 말려 있어서 회전체라고 생각했어요.',
    final: '처음에는 회전체라고만 생각했지만, 직사각형을 한 바퀴 돌리면 같은 모양이 되는 것을 관찰해서 원기둥으로 나타낼 수 있다고 판단했다.',
    simp: '뚜껑의 손잡이와 테두리 홈은 단순하게 보았다.' },
  { k: 'rev', img: 'cone', t: '운동장 라바콘', g: '1모둠', m: 'cone', s: 4 },
  { k: 'rev', img: 'can', t: '매점 음료 캔', g: '8모둠', m: 'cylinder', s: 3 },
  { k: 'rev', img: 'pot', t: '복도 화분', g: '6모둠', m: 'frustum', s: 3 },
  { k: 'rev', img: 'ball', t: '체육관 농구공', g: '7모둠', m: 'sphere', s: 2 },
  { k: 'rev', img: 'globe', t: '과학실 지구본', g: '2모둠', m: 'sphere', s: 1 },
  { k: 'rev', img: 'ball', t: '피구공', g: '5모둠', m: 'sphere', s: 1 },
  { k: 'poly', img: 'box', t: '교탁 위 휴지 상자', g: '2모둠', m: 'cuboid', s: 4 },
  { k: 'poly', img: 'dice', t: '보드게임 주사위', g: '4모둠', m: 'cube', s: 4 },
  { k: 'poly', img: 'hexholder', t: '연필꽂이', g: '6모둠', m: 'hexprism', s: 2 },
  { k: 'poly', img: 'box', t: '보건실 휴지 상자', g: '8모둠', m: 'cuboid', s: 1 },
  { k: 'mix', img: 'funnel', t: '과학실 깔때기', g: '4모둠', m: 'combo', s: 3 },
  { k: 'mix', img: 'pencil', t: '깎은 연필', g: '1모둠', m: 'hexprism', mName: '6각기둥 + 원뿔', s: 1 },
  { k: 'hold', img: 'chair', t: '급식실 의자', g: '5모둠', m: 'chair', s: 1, why: '다리와 등받이가 따로 있어서 하나로 정하기 어려워요.' },
  { k: 'none', img: 'cone', g: '7모둠', s: 0 },
  { k: 'none', img: 'dice', g: '3모둠', s: 0 },
  { k: 'none', img: 'pot', g: '5모둠', s: 0 },
];
const GROUPS = [
  ['1모둠', [4, 1, 0, 0]], ['2모둠', [4, 4, 1, -1]], ['3모둠', [4, 4, 0, 0]], ['4모둠', [4, 3, 0, -1]],
  ['5모둠', [1, 1, 0, -1], 8], ['6모둠', [2, 3, -1, -1]], ['7모둠', [2, 0, -1, -1]], ['8모둠', [3, 1, -1, -1]],
];
const params = new URLSearchParams(location.search);
let phase = +(params.get('phase') ?? 1);

const steps = (n) => `<span class="steps ${n === 4 ? 'all' : ''}" aria-label="${n}/4단계">${[0, 1, 2, 3].map((i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>`;
const card = (c, i) => c.k === 'none'
  ? `<button class="card" type="button" data-i="${i}"><img src="assets/photos/${c.img}.jpg" alt=""><span class="meta"><span class="grp">${c.g}</span><span class="row">이름 붙이기 전 · 생각 쓰는 중</span></span></button>`
  : `<button class="card" type="button" data-i="${i}"><img src="assets/photos/${c.img}.jpg" alt="${c.t} 사진"><span class="grp">${c.g}</span>${c.isNew ? '<span class="new">방금 완료</span>' : ''}
     <span class="meta"><strong>${c.t}</strong>${c.why ? `<span class="why">${c.why}</span>` : ''}
     <span class="row"><span class="model">${c.s >= 3 ? (c.mName || NAMES[c.m]) : '모델 고르기 전'}</span>${steps(c.s)}</span></span></button>`;

function render() {
  document.getElementById('phase-h').textContent = PHASES[phase] + ' 시간';
  document.getElementById('phases').innerHTML = PHASES.map((p, i) => `<li class="${i < phase ? 'done' : i === phase ? 'now' : ''}">${p}</li>`).join('');
  document.getElementById('wall').innerHTML = LANES.map((l) => {
    const list = CARDS.map((c, i) => [c, i]).filter(([c]) => c.k === l.id);
    const cap = l.id === 'rev' || l.id === 'poly' ? 4 : 3;
    const shown = list.slice(0, cap);
    return `<section class="lane k-${l.id}" aria-label="${l.name} ${list.length}장"><header>${ICONS[l.id]}${l.name}<b>${list.length}</b></header>
      <div class="cards">${shown.map(([c, i]) => card(c, i)).join('')}${list.length > cap ? `<button class="more" type="button">+${list.length - cap}장 더 보기</button>` : ''}</div></section>`;
  }).join('');
  document.getElementById('groups').innerHTML = GROUPS.map(([name, slots, stuck]) => {
    const done = slots.filter((s) => s === 4).length;
    return `<div class="g ${stuck ? 'stuck' : ''}"><header><b>${name}</b><span>${stuck ? stuck + '분째 그대로' : `완료 ${done} / 3`}</span></header>
      <div class="slots">${slots.map((s) => `<i class="${s >= 0 ? 'has' : ''} ${s === 4 ? 'full' : ''}" style="--p:${Math.max(0, s) * 25}%"></i>`).join('')}</div></div>`;
  }).join('');
}

function spotlight(i) {
  const c = CARDS[i]; const el = document.getElementById('spot');
  if (!c || c.k === 'none') return;
  const first = c.first || '면의 모양을 관찰하며 첫 생각을 적었어요.';
  const final = c.final || '아직 기록하는 중이에요. 어떤 성질을 확인했는지 모둠에게 물어보세요.';
  el.innerHTML = `<article>
    <figure><img src="assets/photos/${c.img}.jpg" alt="${c.t} 사진"><figcaption>${c.g}가 찍은 사진</figcaption></figure>
    <figure><div class="m">${SOLIDS[c.m]()}</div><figcaption>${c.s >= 3 ? (c.mName || NAMES[c.m]) : '모델 고르기 전'}</figcaption></figure>
    <div class="text"><span class="who">${c.g}</span><h2>${c.t}</h2>
      <div class="then"><h3>처음 생각</h3><span class="tag">${ICONS.rev}회전체</span><p>${first}</p></div>
      <div><h3>최종 판단</h3><p>${final}</p></div>
      ${c.simp ? `<div class="then"><h3>단순하게 본 부분</h3><p>${c.simp}</p></div>` : ''}</div></article>
    <button class="close" type="button" data-act="close">닫기 · Esc</button>`;
  el.classList.add('show'); el.querySelector('.close').focus();
}
function closeSpot() { document.getElementById('spot').classList.remove('show'); }

document.addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.i) spotlight(+t.dataset.i);
  if (t.dataset.act === 'close') closeSpot();
  if (t.dataset.act === 'next') { phase = Math.min(3, phase + 1); render(); }
  if (t.dataset.act === 'prev') { phase = Math.max(0, phase - 1); render(); }
  if (t.dataset.act === 'end') { const c = document.getElementById('confirm'); c.classList.toggle('show'); t.setAttribute('aria-expanded', c.classList.contains('show')); }
  if (t.dataset.act === 'end-no' || t.dataset.act === 'end-yes') { document.getElementById('confirm').classList.remove('show'); }
});
let idle; const dock = document.querySelector('.dock');
document.addEventListener('pointermove', () => { dock.classList.add('awake'); clearTimeout(idle); idle = setTimeout(() => dock.classList.remove('awake'), 2500); });
document.getElementById('spot').addEventListener('click', (e) => { if (e.target.id === 'spot') closeSpot(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSpot(); });
window.addEventListener('message', (e) => {
  const m = e.data; if (!m || m.type !== 'mock') return;
  if ('phase' in m) { phase = m.phase; render(); }
  if ('spot' in m) m.spot ? spotlight(0) : closeSpot();
  if ('dock' in m) dock.classList.toggle('awake', m.dock);
});
render();
if (params.get('spot') === '1') spotlight(0);
if (params.get('dock') === '1') { dock.classList.add('awake'); if (params.get('end') === '1') document.querySelector('[data-act=end]').click(); }
</script>
</body>
</html>
